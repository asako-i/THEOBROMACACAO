<body>

    <header>
        <div class="header">
         <div class="header-logo">
            <a href="./index.html">
            <h1>THEOBROMA CACAO</h1>
            <h3>MAISON</h3></a>
         </div>
        </div>
        <nav class="header-nav">
            <ul>
                <li><a href="./index.html">TOP</a></li>
                <li><a href="./products.html">PRODUCTS</a></li>

                <li><a href="./contact.html">CONTACT</a></li>
            </ul>
        </nav>
        <div class="icon">
            <a href="#"><img src="./img/虫眼鏡アイコン.png" alt="検索"></a>
            <a href="#"><img src="./img/カートのアイコン.png" alt="カート"></a>

    </header>

    <main class="main">
        <!-- <div class="top-img">
            <h1>THEOBROMA CACAO</h1>
            <h3>MAISON</h3>
        </div>         -->
        <div class="products-btn">
          <button class="products"><a href="#">CONTACT</a></button>
        </div>      
    <div class="contact-wrapper">
    <form class="contact-form">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your full name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your@email.com">
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="How may we assist you?"></textarea>
      </div>

      <p class="form-note">
        We typically respond within 2–3 business days.
      </p>

      <button type="submit" class="btn-submit">
        Send Message
      </button>

    </form>
  </div>

  </main>
  
  <footer>
      <div class="email">
       <dl>
          <dt><span class="required">OUR NEWS LETTER</span></dt>
          <dd><input class="input-text"  type="email" name="email" placeholder="&ensp;Eメールアドレス" required>
          <p>最新情報や新商品、お得な情報をEメールにて配信します。</p>
          </dd>
          <button class="submit-button" type="submit">登録</button>
        </dl>
      </div>
        <div class="footer-img">
          <nav class="footer">
            <ul class="footer-nav">
                <li><a href="#">SHOPPING GUIDE</a></li>
                <li><a href="#">RECRUIT</a></li>
                <li><a href="#">店舗情報</a></li>
                <li><a href="#">FAQ</a></li>

                <li><a href="#">FOLLOW US</a></li>
              <div class="follow">
                  <a href="#"><img src="./img/インスタグラムアイコン .png" alt="IG"></a>
                  <a href="#"><img src="./img/FACEBOOKアイコン.png" alt="FB"></a>
                </div>
            </ul>
           </nav>
        </div>

        <div class="footer-bottom">
           <p>&copy;THEOBROMA CACAO MAISON</p>
           <p>プライバシーポリシー</p>
           <p>特定商取引方表示</p>
        </div>
        <div class="toplink">
          <a href="./contact.html"><img src="./img/矢印ボタン　上1.png" alt="矢印"></a>
          <p>TOP</p>
        </div>
    </footer>
